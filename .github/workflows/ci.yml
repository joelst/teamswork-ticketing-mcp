# Builds and tests every pull request and every push to main. Warnings are errors and NuGetAudit fails restore on
# known-vulnerable packages (see Directory.Build.props), so a green run means clean build, clean dependencies, and
# passing tests. Needs no secrets.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both platforms the release builds on.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test -c Release --no-build
      # The Linux release build and container run without ICU (InvariantGlobalization), where Unicode normalisation and
      # IDN mapping silently change meaning. Run the tests that way too, so behaviour that depends on culture data shows.
      # It must be a build setting: the runtimeconfig records it, and the runtime then ignores the environment variable.
      # EXPECT_INVARIANT_GLOBALIZATION makes a test fail if this leg ever runs with culture data after all.
      - name: dotnet test (invariant globalization)
        if: runner.os == 'Linux'
        env:
          EXPECT_INVARIANT_GLOBALIZATION: "1"
        run: dotnet test -c Release --no-restore -p:InvariantGlobalization=true -p:ContinuousIntegrationBuild=true

  # install.sh must run under dash and macOS sh, not only bash; shellcheck knows those portability mistakes.
  install-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck install.sh
        run: shellcheck --shell=sh scripts/install.sh scripts/tests/test-install-helpers.sh
      # The secrets prompts need a terminal, so the helpers behind them are tested on their own.
      - name: install.sh helpers (dash)
        run: sh scripts/tests/test-install-helpers.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors)
          $errors | ForEach-Object { Write-Host "::error file=scripts/install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
          if ($errors) { exit 1 }
      # The skills and manifest template against Microsoft's upload rules, and a test build of the package.
      - name: Cowork plugin
        shell: pwsh
        run: ./scripts/tests/Test-CoworkPlugin.ps1

  # Compiles the templates and their parameter files, which catches a parameter value outside a template's limits
  # before a deployment does. Needs no Azure sign-in.
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compile Bicep
        run: |
          set -eu
          az bicep install
          for t in core app; do
            az bicep build --file "infra/$t.bicep" --stdout > /dev/null
            az bicep build-params --file "infra/$t.bicepparam" --stdout > /dev/null
          done

  # Runs each installer against the newest published release: download, checksum (and signature on Windows),
  # install, startup check, a second install over the first (the upgrade path), and uninstall. Client registration
  # isn't covered: the runners have no MCP clients.
  installer-e2e:
    name: installer end to end (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows pwsh, os: windows-latest, shell: pwsh }
          - { name: windows powershell 5.1, os: windows-latest, shell: powershell }
          - { name: linux, os: ubuntu-latest, shell: sh }
          - { name: macos, os: macos-latest, shell: sh }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # A step's own `shell` can't use the matrix context; the job default can.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      Ticketing__ApiKey: ci-dummy-key
      Ticketing__ServiceAccount__Id: 00000000-0000-0000-0000-0000000000c1
      Ticketing__ServiceAccount__Name: CI
      Ticketing__ServiceAccount__Email: ci@example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The secrets prompts need a terminal, so the helpers behind them are tested on their own, on each edition and
      # (for install.sh) each platform's sh and awk.
      - name: install.ps1 helpers
        if: matrix.shell != 'sh'
        run: ./scripts/tests/Test-InstallHelpers.ps1
      - name: install.sh helpers
        if: matrix.shell == 'sh'
        run: sh scripts/tests/test-install-helpers.sh
      - name: Install, reinstall, uninstall (PowerShell)
        if: matrix.shell != 'sh'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tw-mcp'
          foreach ($pass in 1, 2) {
            $out = & ./scripts/install.ps1 -SkipSecrets -Clients none -InstallDir $dir *>&1 | Out-String
            Write-Host $out
            if ($out -notmatch 'Done\.') { throw "Install pass $pass did not finish" }
          }
          if (-not (Test-Path "$dir/TeamsWork.Ticketing.Mcp.exe")) { throw 'Executable missing' }
          & ./scripts/install.ps1 -Uninstall -Clients none -InstallDir $dir
          if (Test-Path $dir) { throw 'Uninstall left the install folder' }

      - name: Install, reinstall, uninstall (sh)
        if: matrix.shell == 'sh'
        run: |
          dir="$RUNNER_TEMP/tw-mcp"
          for pass in 1 2; do
            sh scripts/install.sh --skip-secrets --clients none --install-dir "$dir" </dev/null | tee out.txt
            grep -q '^Done\.' out.txt || { echo "::error::Install pass $pass did not finish"; exit 1; }
          done
          test -x "$dir/TeamsWork.Ticketing.Mcp"
          sh scripts/install.sh --uninstall --clients none --install-dir "$dir"
          test ! -e "$dir"

  # The Linux executable must start on systems without ICU (minimal images, some WSL distributions); it still needs
  # tzdata, and must say so clearly when it's missing. The stock ubuntu image has neither ICU nor tzdata, so the
  # runner's zoneinfo is mounted in for the first check and left out for the second.
  linux-without-icu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INIT: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Publish the Linux executable as the release does
        run: |
          dotnet publish src/TeamsWork.Ticketing.Mcp -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      # The request is written, then stdin is held open until a reply arrives (up to 60 s), then closed so the server
      # exits. A fixed wait raced a slow start: the server read the request and end of input together, and shut
      # down before answering. The reply goes to a file, read once the server has exited.
      - name: Starts without ICU
        run: |
          REPLY="$RUNNER_TEMP/reply-icu"; : > "$REPLY"
          ( printf '%s\n' "$INIT"; i=0; while [ ! -s "$REPLY" ] && [ "$i" -lt 120 ]; do sleep 0.5; i=$((i + 1)); done ) \
            | docker run --rm -i \
            -v "$PWD/out:/app:ro" -v /usr/share/zoneinfo:/usr/share/zoneinfo:ro \
            -e Ticketing__ApiKey=ci-dummy-key -e Ticketing__ServiceAccount__Id=00000000-0000-0000-0000-0000000000c1 \
            -e Ticketing__ServiceAccount__Name=CI -e Ticketing__ServiceAccount__Email=ci@example.test \
            ubuntu:24.04 sh -c 'if ls /usr/lib/*/libicu* >/dev/null 2>&1; then echo "image has ICU" >&2; exit 1; fi; exec /app/TeamsWork.Ticketing.Mcp --stdio' \
            > "$REPLY"
          RESPONSE=$(head -n1 "$REPLY")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"serverInfo"'

      - name: Without tzdata, stops at startup and names the setting
        run: |
          set +e
          OUTPUT=$(printf '%s\n' "$INIT" | docker run --rm -i -v "$PWD/out:/app:ro" \
            -e Ticketing__ApiKey=ci-dummy-key -e Ticketing__ServiceAccount__Id=00000000-0000-0000-0000-0000000000c1 \
            -e Ticketing__ServiceAccount__Name=CI -e Ticketing__ServiceAccount__Email=ci@example.test \
            ubuntu:24.04 sh -c 'if [ -e /usr/share/zoneinfo/America/Chicago ]; then echo "image has tzdata" >&2; exit 1; fi; exec /app/TeamsWork.Ticketing.Mcp --stdio' 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          [ "$STATUS" -ne 0 ] && echo "$OUTPUT" | grep -q 'Ticketing:DefaultTimeZoneId is not a time zone this machine knows'

  # Builds the image the pipeline deploys, from the same base image, and starts it. This is what catches a base image
  # that lacks something the server checks at startup (tzdata for Ticketing:DefaultTimeZoneId).
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Build the container image into the local Docker daemon
        run: |
          dotnet publish src/TeamsWork.Ticketing.Mcp/TeamsWork.Ticketing.Mcp.csproj -c Release --os linux --arch x64 \
            /t:PublishContainer -p:ContainerRepository=teamswork-taas-mcp -p:ContainerImageTags=ci

      - name: Start the image
        run: |
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          # As in linux-without-icu: stdin stays open until the reply arrives, rather than for a fixed time.
          REPLY="$RUNNER_TEMP/reply-image"; : > "$REPLY"
          ( printf '%s\n' "$INIT"; i=0; while [ ! -s "$REPLY" ] && [ "$i" -lt 120 ]; do sleep 0.5; i=$((i + 1)); done ) \
            | docker run --rm -i \
            -e Ticketing__ApiKey=ci-dummy-key -e Ticketing__ServiceAccount__Id=00000000-0000-0000-0000-0000000000c1 \
            -e Ticketing__ServiceAccount__Name=CI -e Ticketing__ServiceAccount__Email=ci@example.test \
            teamswork-taas-mcp:ci --stdio > "$REPLY"
          RESPONSE=$(head -n1 "$REPLY")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"serverInfo"'

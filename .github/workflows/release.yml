# Builds and publishes a GitHub release when a version tag (v1.2.3 or v0.1.0-beta) is pushed.
# Tags starting with v0. or containing a hyphen are published as pre-releases.
# If the release already exists (for example, it was published from the GitHub UI, which pushes the tag),
# the binaries are attached to it and its title and notes are left alone.
# Run it manually with a tag to rebuild an existing tag using this version of the workflow.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release, e.g. v0.1.2-beta
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  PROJECT: src/TeamsWork.Ticketing.Mcp/TeamsWork.Ticketing.Mcp.csproj
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  build:
    needs: test
    # The environment fixes the OIDC subject (repo:joelst/teamswork-ticketing-mcp:environment:release) that the
    # Azure federated credential used for Windows code signing trusts.
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            rid: win-x64
            exe: TeamsWork.Ticketing.Mcp.exe
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            exe: TeamsWork.Ticketing.Mcp
            archive: tar.gz
          - name: osx-arm64
            os: macos-latest
            rid: osx-arm64
            exe: TeamsWork.Ticketing.Mcp
            archive: tar.gz
          # Built on Windows so its assembly can be Authenticode-signed; no apphost, it runs through `dotnet`.
          - name: portable
            os: windows-latest
            rid: ""
            exe: ""
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: |
          COMMON="-c Release -p:Version=$VERSION -p:DebugType=none -p:IsTransformWebConfigDisabled=true -o out"
          if [ -n "${{ matrix.rid }}" ]; then
            dotnet publish "$PROJECT" $COMMON -r ${{ matrix.rid }} --self-contained \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          else
            dotnet publish "$PROJECT" $COMMON -p:UseAppHost=false
          fi

      # Windows only: Azure Artifact Signing issues Authenticode signatures, which Linux and macOS don't use.
      # Only this project's own binary is signed; the Microsoft and third-party DLLs keep their publishers' signatures.
      - name: Azure login for code signing
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          SIGN_FILE: out/${{ matrix.exe || 'TeamsWork.Ticketing.Mcp.dll' }}
        run: |
          $missing = 'AZURE_TRUSTED_SIGNING_ENDPOINT', 'AZURE_TRUSTED_SIGNING_ACCOUNT_NAME', 'AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME' |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) { throw "Code signing is not configured. Missing variables: $($missing -join ', ')" }

          Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Force -Repository PSGallery
          Invoke-ArtifactSigning `
            -Endpoint $env:AZURE_TRUSTED_SIGNING_ENDPOINT `
            -CodeSigningAccountName $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME `
            -CertificateProfileName $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME `
            -Files (Resolve-Path $env:SIGN_FILE).Path `
            -FileDigest SHA256 `
            -TimestampRfc3161 'http://timestamp.acs.microsoft.com' `
            -TimestampDigest SHA256 `
            -Description 'TeamsWork Ticketing MCP' `
            -DescriptionUrl 'https://github.com/joelst/teamswork-ticketing-mcp'

          $sig = Get-AuthenticodeSignature $env:SIGN_FILE
          Write-Host "$($env:SIGN_FILE): $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signature on $($env:SIGN_FILE) is $($sig.Status): $($sig.StatusMessage)" }

      - name: Stage files
        run: |
          STAGE="teamswork-ticketing-mcp-$VERSION-${{ matrix.name }}"
          mkdir -p "stage/$STAGE"
          if [ -n "${{ matrix.exe }}" ]; then
            cp "out/${{ matrix.exe }}" "stage/$STAGE/"
          else
            # Framework-dependent: everything except web-server leftovers.
            (cd out && cp -R . "../stage/$STAGE/")
            rm -f "stage/$STAGE"/web.config "stage/$STAGE"/appsettings.Development.json \
                  "stage/$STAGE"/*.staticwebassets.*.json "stage/$STAGE"/aspnetcorev2_inprocess.dll
          fi
          cp LICENSE README.md "stage/$STAGE/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ls -la "stage/$STAGE"

      - name: Smoke test over stdio
        timeout-minutes: 2
        env:
          Ticketing__ApiKey: ci-dummy-key
          Ticketing__ServiceAccount__Id: ci
          Ticketing__ServiceAccount__Name: CI
          Ticketing__ServiceAccount__Email: ci@example.test
        run: |
          cd "stage/$STAGE"
          if [ -n "${{ matrix.exe }}" ]; then CMD="./${{ matrix.exe }}"; else CMD="dotnet TeamsWork.Ticketing.Mcp.dll"; fi
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          RESPONSE=$( (printf '%s\n' "$INIT"; sleep 8) | $CMD --stdio 2>/dev/null | head -n1 )
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "\"version\":\"$VERSION\""

      - name: Archive
        run: |
          mkdir -p dist
          cd stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v zip >/dev/null; then zip -qr "../dist/$STAGE.zip" "$STAGE"; else 7z a -tzip "../dist/$STAGE.zip" "$STAGE" >/dev/null; fi
          else
            tar -czf "../dist/$STAGE.tar.gz" "$STAGE"
          fi
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; attaching files."
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          VERSION="${TAG#v}"
          PRERELEASE=""
          case "$VERSION" in 0.*|*-*) PRERELEASE="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          MCP server for the TeamsWork Ticketing API. See the README for configuration and client setup.

          ## Downloads

          | File | Platform | Needs .NET installed |
          | --- | --- | --- |
          | `*-win-x64.zip` | Windows x64 | No |
          | `*-linux-x64.tar.gz` | Linux x64 | No |
          | `*-osx-arm64.tar.gz` | macOS Apple silicon | No |
          | `*-portable.zip` | Any OS | Yes, .NET 10 runtime. Run `dotnet TeamsWork.Ticketing.Mcp.dll --stdio` |

          `SHA256SUMS.txt` lists checksums for every file.

          ## First run

          The Windows executable and the portable build's `TeamsWork.Ticketing.Mcp.dll` are Authenticode-signed. The Linux and macOS executables are not signed.

          - **Windows:** SmartScreen may still warn about a newly released file until it builds reputation. Choose **More info**, then **Run anyway**, or unblock the file with `Unblock-File .\TeamsWork.Ticketing.Mcp.exe`. The portable zip is an alternative; it runs through Microsoft's signed `dotnet` host.
          - **macOS:** remove the quarantine flag with `xattr -d com.apple.quarantine ./TeamsWork.Ticketing.Mcp`.
          - **Linux/macOS:** the tarball keeps the execute bit; if it is lost, run `chmod +x TeamsWork.Ticketing.Mcp`.

          ## Configure

          Set the API key and the account ticket changes are recorded under, as environment variables or in a user-secrets file. See "Configure without the .NET SDK" in the README.
          EOF
          gh release create "$TAG" dist/* $PRERELEASE --title "v$VERSION" --notes-file notes.md --generate-notes
